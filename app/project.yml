name: RezkaPlayer
options:
  bundleIdPrefix: com.rezkaplayer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.2"
    CURRENT_PROJECT_VERSION: "7"
    PRODUCT_NAME: RezkaPlayer
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Hardened runtime is only needed for notarization; off for the free ad-hoc build.
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  RezkaPlayer:
    type: application
    platform: macOS
    sources:
      - path: Sources/RezkaPlayer
    dependencies:
      - package: Sparkle
    info:
      path: Sources/RezkaPlayer/Info.plist
      properties:
        CFBundleDisplayName: Rezka Player
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ru
          - uk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        # Sparkle auto-update: the appcast is published as a release asset on every tagged
        # build, served from GitHub's stable "latest release" URL. SUPublicEDKey is the EdDSA
        # public key whose private half (a CI secret + the maintainer's Keychain) signs each DMG.
        SUFeedURL: https://github.com/rmaltsev1/media-player-mac-app/releases/latest/download/appcast.xml
        SUPublicEDKey: ShsNIkWsNmoblcM+MqgzlwKBdDjVPpUaYTiOIi/6YWs=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Allow the app to talk to the local sidecar over plain HTTP on loopback.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
    entitlements:
      path: Sources/RezkaPlayer/RezkaPlayer.entitlements
      properties:
        # Sandbox OFF for now: we spawn a Python helper and write downloads freely.
        # (Re-enable + add a bundled helper before any distribution.)
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
